name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Classify changed runtime inputs
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.impact.outputs.scope }}
      matrix: ${{ steps.impact.outputs.matrix }}
      buildImages: ${{ steps.impact.outputs.buildImages }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: impact
        run: node scripts/release-impact.mjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}

  quality:
    needs: impact
    name: Format, types, tests, and deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: pi_conformance
          POSTGRES_USER: pi_conformance
          POSTGRES_PASSWORD: pi_conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi_conformance -d pi_conformance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Read pinned Cube source revision
        if: needs.impact.outputs.scope == 'full'
        id: cube-source
        run: node -e 'console.log("commit=" + require("./deploy/cubesandbox/runtime-build.json").upstreamCommit)' >> "$GITHUB_OUTPUT"

      - name: Check out pinned Cube source for native contracts
        if: needs.impact.outputs.scope == 'full'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: TencentCloud/CubeSandbox
          ref: ${{ steps.cube-source.outputs.commit }}
          path: .cache/cubesandbox-source
          persist-credentials: false

      - name: Run reproducible local CI checks
        if: needs.impact.outputs.scope == 'full'
        run: npm run ci
        env:
          PI_CLOUD_CUBESANDBOX_REPOSITORY: ${{ github.workspace }}/.cache/cubesandbox-source
          PI_CLOUD_PI_SESSION_CONFORMANCE_DATABASE_URL: postgresql://pi_conformance:pi_conformance@127.0.0.1:5432/pi_conformance
          PI_CLOUD_POSTGRES_INTEGRATION_URL: postgresql://pi_conformance:pi_conformance@127.0.0.1:5432/pi_conformance

      - name: Run provider or catalog contracts
        if: needs.impact.outputs.scope == 'provider' || needs.impact.outputs.scope == 'catalog'
        run: npm run dependencies:harden && npm run format:check && npm run docs:check && npm run release:check -- "$RELEASE_SCOPE"
        env:
          RELEASE_SCOPE: ${{ needs.impact.outputs.scope }}
          PI_CLOUD_PI_SESSION_CONFORMANCE_DATABASE_URL: postgresql://pi_conformance:pi_conformance@127.0.0.1:5432/pi_conformance
          PI_CLOUD_POSTGRES_INTEGRATION_URL: postgresql://pi_conformance:pi_conformance@127.0.0.1:5432/pi_conformance

      - name: Validate documentation-only changes
        if: needs.impact.outputs.scope == 'docs'
        run: npm run format:check && npm run docs:check

      - name: Verify Cube template cleanup and artifact reference preservation
        if: needs.impact.outputs.scope == 'full'
        run: node scripts/check-cube-template-cleanup.mjs
        env:
          PI_CLOUD_CUBESANDBOX_REPOSITORY: ${{ github.workspace }}/.cache/cubesandbox-source

      - name: Verify Docker build context excludes local runtime data
        run: npm run image:context-check

      - name: Prepare root evidence directory
        run: mkdir -p dist/ci-evidence

      - name: Verify browser rendering effects without model tokens
        if: needs.impact.outputs.scope == 'full' || needs.impact.outputs.scope == 'catalog'
        run: npm run browser:presentation:check

      - name: Generate root dependency SBOM
        if: needs.impact.outputs.scope == 'full'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/ci-evidence/pi-cloud-root.cdx.json
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Upload root SBOM
        if: needs.impact.outputs.scope == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-cloud-root-sbom
          path: dist/ci-evidence/pi-cloud-root.cdx.json
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    needs: impact
    if: needs.impact.outputs.buildImages == 'true'
    name: SBOM and vulnerability gate (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.impact.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build revision-labelled production image
        run: |
          guest_revision="$(node --input-type=module -e 'import { guestBuildIdentity } from "./scripts/lib/guest-build-identity.mjs"; console.log(await guestBuildIdentity(process.cwd()))')"
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --build-arg PI_CLOUD_VERSION=ci \
            --build-arg PI_CLOUD_GOPROXY=https://proxy.golang.org,direct \
            --build-arg PI_CLOUD_REVISION="${{ github.sha }}" \
            --build-arg PI_CLOUD_IMAGE_REVISION="$guest_revision" \
            --tag "pi-cloud/${{ matrix.image }}:ci" \
            .

      - name: Prepare evidence directory
        run: mkdir -p evidence

      - name: Set up Node.js for Volume contract tests
        if: matrix.image == 'workspace-volume-gateway'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Verify native Volume initialization and process-loss recovery
        if: matrix.image == 'workspace-volume-gateway'
        run: node scripts/run-volume-initialization-contract-check.mjs | tee evidence/volume-initialization.json
        env:
          PI_CLOUD_TEST_IMAGE: pi-cloud/workspace-volume-gateway:ci

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: pi-cloud/${{ matrix.image }}:ci
          format: cyclonedx-json
          output-file: evidence/${{ matrix.image }}.cdx.json
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Record all high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0; Trivy v0.70.0
        with:
          scan-type: image
          image-ref: pi-cloud/${{ matrix.image }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: evidence/${{ matrix.image }}.vulnerabilities.json
          exit-code: 0
          timeout: 10m

      - name: Reject fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0; Trivy v0.70.0
        with:
          scan-type: image
          image-ref: pi-cloud/${{ matrix.image }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: 1
          timeout: 10m
          trivyignores: .trivyignore.yaml

      - name: Upload image supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-cloud-${{ matrix.image }}-supply-chain
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
