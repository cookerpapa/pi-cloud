name: pi-cloud-streaming-comparison

services:
  kafka:
    image: apache/kafka@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "16"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - 127.0.0.1:19094:19094
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          CMD-SHELL,
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1",
        ]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s
    mem_limit: 1g
    cpus: 2.0

  valkey:
    image: valkey/valkey@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory-policy
      - noeviction
    ports:
      - 127.0.0.1:16380:6379
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 768m
    cpus: 2.0

  nats:
    image: nats@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    command: [--jetstream, --store_dir=/data, --http_port=18223, --name=pi-cloud-comparison]
    ports:
      - 127.0.0.1:14223:4222
      - 127.0.0.1:18223:18223
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        [CMD-SHELL, "wget -q -O - http://127.0.0.1:18223/healthz?js-enabled-only=true | grep -q ok"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 768m
    cpus: 2.0

volumes:
  kafka-data:
  valkey-data:
  nats-data:
