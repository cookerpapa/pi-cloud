name: pi-cloud-jetstream-production-shape

x-nats: &nats
  image: nats@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
  mem_limit: 512m
  cpus: 1.5
  healthcheck:
    test:
      [CMD-SHELL, "wget -q -O - http://127.0.0.1:8222/healthz?js-enabled-only=true | grep -q ok"]
    interval: 2s
    timeout: 2s
    retries: 45
    start_period: 5s

services:
  postgres:
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: pi_cloud_streaming_spike
      POSTGRES_USER: pi_cloud_streaming_spike
      POSTGRES_PASSWORD: local-spike-only-password
    ports:
      - 127.0.0.1:15434:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pi_cloud_streaming_spike -d pi_cloud_streaming_spike]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 512m
    cpus: 1.0

  nats-1:
    <<: *nats
    command: [--config, /etc/nats/nats.conf]
    ports:
      - 127.0.0.1:14231:4222
      - 127.0.0.1:18231:8222
    volumes:
      - nats-1-data:/data
      - ./nats-1.conf:/etc/nats/nats.conf:ro

  nats-2:
    <<: *nats
    command: [--config, /etc/nats/nats.conf]
    ports:
      - 127.0.0.1:14232:4222
      - 127.0.0.1:18232:8222
    volumes:
      - nats-2-data:/data
      - ./nats-2.conf:/etc/nats/nats.conf:ro

  nats-3:
    <<: *nats
    command: [--config, /etc/nats/nats.conf]
    ports:
      - 127.0.0.1:14233:4222
      - 127.0.0.1:18233:8222
    volumes:
      - nats-3-data:/data
      - ./nats-3.conf:/etc/nats/nats.conf:ro

volumes:
  postgres-data:
  nats-1-data:
  nats-2-data:
  nats-3-data:
