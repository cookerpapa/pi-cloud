{{- if or (lt (int .Values.replicas) 0) (gt (int .Values.replicas) 1) -}}
{{- fail "The local BoxLite node supports zero or one API Pod" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata: { name: {{ .Release.Name }}-config }
data:
  node.json: |
    {{ dict "nodeId" (required "nodeId is required" .Values.nodeId) "directory" "/var/lib/pi-cloud-boxlite" "volumePlugin" "/opt/pi-cloud/bin/workspace-volume-attachment" "port" 8091 "profiles" .Values.profiles "registries" .Values.registries "allowedAddresses" .Values.allowedAddresses | toJson }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }} }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: api, port: 8091, targetPort: api }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: {{ .Release.Name }} }
spec:
  serviceName: {{ .Release.Name }}
  replicas: {{ .Values.replicas }}
  updateStrategy: { type: OnDelete }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: boxlite-node }
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ required "nodeName is required" .Values.nodeName | quote }}
      # Native PID/start-time evidence must refer to the host namespace after a
      # container restart. This trusted node role is outside every untrusted VM.
      hostPID: true
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      containers:
        - name: node
          image: {{ required "Pinned node image is required" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext: { privileged: true, runAsUser: 0 }
          env:
            - { name: PI_CLOUD_BOXLITE_NODE_CONFIG, value: /etc/pi-cloud-boxlite/node.json }
            - { name: PI_CLOUD_SANDBOX_CONTROL_TOKEN_FILE, value: /run/pi-cloud-secrets/sandbox-control-token }
            - { name: RUST_LOG, value: warn }
          ports: [{ name: api, containerPort: 8091 }]
          readinessProbe: { httpGet: { path: /health/ready, port: api }, periodSeconds: 5, timeoutSeconds: 3 }
          # Restart only the API child on its failure; do not destroy detached
          # VMMs merely because a short HTTP process restarted.
          livenessProbe:
            exec:
              command: [/usr/bin/supervisorctl, -c, /etc/pi-cloud/boxlite-supervisord.conf, pid]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/pi-cloud-boxlite, readOnly: true }
            - { name: state, mountPath: /var/lib/pi-cloud-boxlite }
            - { name: workspace, mountPath: /data/cube-shared/volume }
            - { name: secrets, mountPath: /run/pi-cloud-secrets/sandbox-control-token, subPath: sandbox-control-token, readOnly: true }
      volumes:
        - name: config
          configMap: { name: {{ .Release.Name }}-config }
        - name: state
          hostPath: { path: {{ required "dataDirectory is required" .Values.dataDirectory | quote }}, type: Directory }
        - name: workspace
          hostPath: { path: {{ required "workspacePoolDirectory is required" .Values.workspacePoolDirectory | quote }}, type: Directory }
        - name: secrets
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 256
            items: [{ key: sandbox-control-token, path: sandbox-control-token }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-api }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: {{ .Values.controlPlaneRelease | quote }} }
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [control-plane, session-runtime]
      ports: [{ protocol: TCP, port: 8091 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ .Release.Name }}-control-access }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Values.controlPlaneRelease | quote }} }
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [control-plane, session-runtime]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
      ports: [{ protocol: TCP, port: 8091 }]
