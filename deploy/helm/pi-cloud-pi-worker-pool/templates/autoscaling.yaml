{{- if .Values.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "pi-cloud-pi-worker-pool.name" . }}-postgres
  labels:
    {{- include "pi-cloud-pi-worker-pool.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: connection
      name: {{ .Values.database.existingSecret }}
      key: {{ .Values.database.notificationUrlKey }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "pi-cloud-pi-worker-pool.name" . }}
  labels:
    {{- include "pi-cloud-pi-worker-pool.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "pi-cloud-pi-worker-pool.name" . }}
    envSourceContainerName: pi-worker
  pollingInterval: {{ .Values.autoscaling.pollingIntervalSeconds }}
  cooldownPeriod: {{ .Values.autoscaling.cooldownSeconds }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  fallback:
    failureThreshold: 3
    replicas: {{ .Values.autoscaling.minReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - { type: Percent, value: 100, periodSeconds: 60 }
            - { type: Pods, value: 4, periodSeconds: 60 }
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDownStabilizationSeconds }}
          policies:
            - type: Pods
              value: 1
              periodSeconds: {{ .Values.autoscaling.scaleDownPeriodSeconds }}
          selectPolicy: Min
  triggers:
    - type: postgresql
      authenticationRef:
        name: {{ include "pi-cloud-pi-worker-pool.name" . }}-postgres
      metadata:
        query: >-
          SELECT COUNT(*)::double precision FROM (
            SELECT tenant_id, pi_session_id FROM session_leases WHERE released_at IS NULL AND valid_until > now()
            UNION
            SELECT s.tenant_id, s.pi_session_id FROM runs r
              JOIN sessions s ON s.id=r.session_id
              JOIN pi_sessions family ON family.tenant_id=s.tenant_id AND family.id=s.pi_session_id
              JOIN agent_revisions agent ON agent.id=r.agent_revision_id
              WHERE r.state='queued' AND r.ready_at IS NOT NULL AND r.available_at<=now()
                AND s.session_kind='conversation' AND agent.runtime_kind='pi_sdk'
                AND family.unsealed_runs=0
          ) AS families
        targetQueryValue: {{ .Values.autoscaling.targetSessionsPerReplica | quote }}
        activationTargetQueryValue: "0"
{{- end }}
