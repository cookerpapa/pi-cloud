global:
  imagePullSecrets: []
  kafka:
    brokers: [kafka-1:9092, kafka-2:9092, kafka-3:9092]
    partitions: 32
    replicas: 3
    producerPendingBytes: 67108864
    producerPendingFacts: 4096

workerPool:
  name: primary
  replicas: 2
  capacity: null
  clusterDomain: cluster.local

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 32
  pollingIntervalSeconds: 5
  cooldownSeconds: 900
  targetSessionsPerReplica: 4
  scaleDownStabilizationSeconds: 900
  scaleDownPeriodSeconds: 600

lifecycle:
  terminationGracePeriodSeconds: 1320

management:
  ingress:
    enabled: false
    className: ""
    hostSuffix: workers.pi-cloud.local
    scheme: http

image:
  repository: pi-cloud/supervisor-host
  tag: production
  digest: ""
  pullPolicy: IfNotPresent

services:
  controlPlaneUrl: http://control-plane.pi-cloud-system.svc.cluster.local:3000
  sandboxControlUrls:
    - http://sandbox-control.pi-cloud-system.svc.cluster.local:4300
  providerProxyUrl: http://provider-egress-relay.pi-cloud-system.svc.cluster.local:3129
  providerGatewayUrl: http://cli-proxy-api.pi-cloud-system.svc.cluster.local:8317
  otlpTracesEndpoint: ""

database:
  existingSecret: pi-cloud-pi-worker-secrets
  urlKey: database-url
  notificationUrlKey: database-notification-url
  maxConnections: 8

credentials:
  supervisorEnrollmentTokenKey: supervisor-enrollment-token
  supervisorManagementTokenKey: supervisor-management-token
  sandboxControlTokenKey: sandbox-control-token
  providerGatewayApiKeyKey: cli-proxy-api-key
  metricsTokenKey: metrics-token

runtime:
  allowInsecureInternalHttp: true
  modelConcurrency: null
  sessionModelConcurrency: null
  subagents:
    maximumDepth: null
    maximumNodes: null
  timeouts:
    sandboxControlRequestMs: 360000
    modelCapabilityTtlMs: 900000
    modelUpstreamConnectMs: 120000
    modelUpstreamIdleMs: 300000
    modelRequestMs: 150000
    turnMs: 600000

state:
  storageClassName: ""
  accessModes: [ReadWriteOncePod]
  size: 1Gi

resources:
  requests: { cpu: 500m, memory: 2Gi }

networkPolicy:
  enabled: true
  trustedNamespaceLabel:
    key: pi-cloud.io/trusted-plane
    value: "true"
  trustedTcpPorts: [8333, 443, 3000, 3129, 4300, 4318, 5432, 8317, 9092]
  externalEgressCidrs: []

disruptionBudget:
  minAvailable: 1

placement:
  nodeSelector: {}
  tolerations: []

serviceAccount:
  create: true
  name: ""

# A private S3 bucket with durable PUT acknowledgements; provision it before rollout.
imageAttachments:
  endpoint: ""
  region: us-east-1
  bucket: pi-cloud-session-images
  credentialsSecretKey: session-image-s3-credentials.json
