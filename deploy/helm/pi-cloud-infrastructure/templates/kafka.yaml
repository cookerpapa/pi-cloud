{{- range $id := list 1 2 3 }}
---
apiVersion: v1
kind: Service
metadata: { name: kafka-{{ $id }} }
spec:
  # Controllers must discover each other before broker readiness succeeds.
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: kafka-{{ $id }} }
  ports: [{ name: kafka, port: 9092, targetPort: 9092 }, { name: controller, port: 9093, targetPort: 9093 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka-{{ $id }} }
spec:
  serviceName: kafka-{{ $id }}
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: kafka-{{ $id }} }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: kafka-{{ $id }} }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      nodeSelector: { kubernetes.io/hostname: {{ $.Values.nodeName | quote }} }
      securityContext: { runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: kafka
          image: {{ $.Values.kafka.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: CLUSTER_ID, value: {{ $.Values.kafka.clusterId | quote }} }
            - { name: KAFKA_NODE_ID, value: {{ $id | quote }} }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: {{ printf "INTERNAL://kafka-%d:9092" $id | quote }} }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS, value: "32" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "2" }
            - { name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_MIN_INSYNC_REPLICAS, value: "2" }
            - { name: KAFKA_NUM_PARTITIONS, value: "32" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
          ports: [{ name: kafka, containerPort: 9092 }, { name: controller, containerPort: 9093 }]
          readinessProbe: { tcpSocket: { port: kafka }, periodSeconds: 5, timeoutSeconds: 2 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 100m, memory: 768Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: pi-cloud-kafka-{{ $id }} } }]
{{- end }}
