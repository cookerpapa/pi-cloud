apiVersion: v1
kind: Service
metadata: { name: session-images }
spec:
  publishNotReadyAddresses: true
  selector:
    {
      app.kubernetes.io/instance: {{ .Release.Name }},
      app.kubernetes.io/component: session-images,
    }
  ports:
    - { name: s3, port: 8333, targetPort: 8333 }
    - { name: master, port: 9333, targetPort: 9333 }
    - { name: master-grpc, port: 19333, targetPort: 19333 }
    - { name: filer, port: 8888, targetPort: 8888 }
    - { name: filer-grpc, port: 18888, targetPort: 18888 }
    - { name: volume, port: 8080, targetPort: 8080 }
    - { name: volume-grpc, port: 18080, targetPort: 18080 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: pi-cloud-session-images-config }
data:
  filer.toml: |
    [leveldb2]
    enabled = false
    [sqlite]
    enabled = true
    dbFile = "file:/data/filer.db?_pragma=journal_mode(WAL)&_pragma=synchronous(FULL)"
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: session-images }
spec:
  serviceName: session-images
  replicas: 1
  selector:
    matchLabels:
      {
        app.kubernetes.io/instance: {{ .Release.Name }},
        app.kubernetes.io/component: session-images,
      }
  template:
    metadata:
      labels:
        {
          app.kubernetes.io/instance: {{ .Release.Name }},
          app.kubernetes.io/component: session-images,
        }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      nodeSelector: { kubernetes.io/hostname: {{ .Values.nodeName | quote }} }
      securityContext:
        {
          runAsUser: 1000,
          runAsGroup: 1000,
          runAsNonRoot: true,
          fsGroup: 1000,
          fsGroupChangePolicy: OnRootMismatch,
          seccompProfile: { type: RuntimeDefault },
        }
      containers:
        - name: session-images
          image: {{ .Values.sessionImages.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            [
              server,
              -dir=/data,
              -ip=session-images,
              -ip.bind=0.0.0.0,
              -s3,
              -s3.config=/run/secrets/s3.json,
              -master.volumeSizeLimitMB=256,
              -volume.max=64,
            ]
          ports: [{ name: s3, containerPort: 8333 }]
          readinessProbe: { tcpSocket: { port: s3 }, periodSeconds: 5 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "2", memory: 512Mi } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - {
                name: config,
                mountPath: /etc/seaweedfs/filer.toml,
                subPath: filer.toml,
                readOnly: true,
              }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: pi-cloud-session-images } }
        - { name: config, configMap: { name: pi-cloud-session-images-config } }
        - name: secrets
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 288
            items: [{ key: session-image-s3-server.json, path: s3.json }]
