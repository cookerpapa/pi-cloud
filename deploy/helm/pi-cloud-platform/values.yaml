profile: distributed

piWorkersEnabled: true
sandboxPlaneEnabled: true
globalPlaneEnabled: true

sandboxDomains:
  - id: sandbox-domain-0001
    displayName: Primary sandbox domain
    state: active
    sandboxControlBaseUrl: http://control-plane:4300
    workspaceStorageKey: workspace-domain-0001
    maximumActiveSandboxes: null

global:
  clusterDomain: cluster.local
  existingSecret: pi-cloud-platform-secrets
  imagePullSecrets: []
  imageRevision: development
  storageClassName: ""
  trustedNodeSelector: {}
  trustedTolerations: []
  kafka:
    brokers:
      - kafka-0.kafka.svc.cluster.local:9092
      - kafka-1.kafka.svc.cluster.local:9092
      - kafka-2.kafka.svc.cluster.local:9092
    replicas: 3
    partitions: 32
    producerPendingBytes: 67108864
    producerPendingFacts: 4096
    acceptedFactRetentionMs: 7200000

images:
  controlPlane:
    repository: pi-cloud/control-plane
    tag: production
    pullPolicy: IfNotPresent
  web:
    repository: pi-cloud/web-ui
    tag: production
    pullPolicy: IfNotPresent
  workspaceVolumeGateway:
    repository: pi-cloud/workspace-volume-gateway
    tag: production
    pullPolicy: IfNotPresent
  sshGateway:
    repository: pi-cloud/ssh-gateway
    tag: production
    pullPolicy: IfNotPresent

bootstrap:
  enabled: true
  tenantId: "00000000-0000-4000-8000-000000000001"
  tenantSlug: pi-cloud
  userId: "00000000-0000-4000-8000-000000000001"
  apiCredentialId: "00000000-0000-4000-8000-000000000001"
  credentialBindingId: "00000000-0000-4000-8000-000000000001"
  defaultModelProfileId: "00000000-0000-4000-8000-000000000001"
  modelProfileName: pi-cloud-default
  maximumProjects: null
  maximumSessions: null

controlPlane:
  # null advertises every registered ordinary Tool; [] withdraws all ordinary Tools.
  enabledControlTools: null
  imageGeneration:
    model: ""
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCpuUtilization: 65
  platformModelSourceTenantId: "00000000-0000-4000-8000-000000000001"
  platformOperatorTenantId: "00000000-0000-4000-8000-000000000001"
  publicRegistration:
    enabled: true
    maximumTenants: null
    maximumProjects: null
    maximumSessions: null
  supervisorIdPrefix: pi-cloud-pi-worker-
  publicOriginBaseUrl: https://pi-cloud.example.com
  previewOriginBaseUrl: ""
  cookieSecure: true
  noProxy: "127.0.0.1,localhost,.svc,.cluster.local"
  sourceControl:
    github:
      enabled: false
      appId: ""
      issueLabel: picloud
      privateKeySecretKey: github-app-private-key.pem
      webhookSecretKey: github-webhook-secret
    gitlab:
      enabled: false
      webhookUrl: https://pi-cloud.example.com/v1/source-control/gitlab/webhook
      internalBaseUrl: ""
      workspaceBaseUrl: ""
      issueLabel: picloud
      credentialMasterKeySecretKey: source-control-credential-master-key
  resources:
    requests: { cpu: 500m, memory: 1Gi }

sshGateway:
  enabled: true
  replicas: 2
  advertisedHost: ssh.pi-cloud.example.com
  port: 2222
  hostPort: 0
  hostIP: 127.0.0.1
  ticketTtlMs: 86400000
  serviceType: LoadBalancer
  resources:
    requests: { cpu: 50m, memory: 64Mi }

web:
  replicas: 2
  hostPorts: { http: 0, admin: 0, provider: 0 }
  hostIP: 127.0.0.1
  adminHostIP: 127.0.0.1
  adminOriginBaseUrl: https://admin.pi-cloud.example.com
  managementUrls:
    providerGateway: ""
    grafana: ""
    prometheus: ""
    alertmanager: ""
    jaeger: ""
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCpuUtilization: 70
  ingress:
    enabled: false
    className: ""
    host: pi-cloud.example.com
    adminHost: admin.pi-cloud.example.com
    tlsSecretName: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }

external:
  database:
    # PgBouncer transaction pooling requires protocol prepared-statement tracking
    # (PgBouncer >=1.21, max_prepared_statements >0; start with 128). The separate
    # database-notification-url Secret key must target PostgreSQL directly.
    secretKey: database-url
    notificationSecretKey: database-notification-url
    apiTokenSecretKey: api-token
  providerProxyUrl: https://provider-proxy.example.com:3129
  otlpTracesEndpoint: ""

networkPolicy:
  enabled: true
  trustedNamespaceLabel:
    key: pi-cloud.io/trusted-plane
    value: "true"
  trustedTcpPorts: [8333, 443, 3000, 3129, 4100, 4300, 4318, 4500, 5432, 9092, 9464, 9465, 9466]
  # Add explicit CIDRs for PostgreSQL/PgBouncer, provider proxy,
  # Cube API and OTLP endpoints. Never use 0.0.0.0/0 here.
  externalEgressCidrs: []

sandboxPlane:
  volumeGatewayUrl: http://workspace-volume-gateway:4500
  domainId: sandbox-domain-0001
  volumeGatewayReplicas: 2
  volumeGatewayMaximumConcurrentOperations: 2
  volumeGatewayMaximumQueuedOperations: 32
  volumeGatewayQueueWaitTimeoutMs: 30000
  workspaceDeletionReaperIntervalMs: 30000
  workspaceDeletionReaperBatchSize: 16
  volumeGatewayRequestTimeoutMs: 660000
  maximumActivePerReplica: null
  maximumActiveCommands: 32
  elasticRetentionMs: 900000
  workspace:
    existingClaim: pi-cloud-workspaces-rwx
  cube:
    # All Projector replicas need the endpoints of every served Cube cluster.
    executionEndpoints: []
    apiUrl: https://cube-api.example.com
    templateId: pi-cloud-tool-v1
    developmentTemplateIds:
      starter: tpl-000000000000000000000000
      standard: tpl-000000000000000000000000
      performance: tpl-000000000000000000000000
    proxyNodeIp: cube-proxy.example.com
    proxyPort: 443
    proxyScheme: https
    domain: cube.example.com
    egressProxyHost: 10.255.255.254
    egressProxyPort: 3128
    directPrivateCidrs: []
    requestTimeoutMs: 120000
  volumeGatewayResources:
    requests: { cpu: 250m, memory: 256Mi }

pi-workers:
  workerPool:
    name: primary-v1
    replicas: 2
    capacity: null
    clusterDomain: cluster.local
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 32
    pollingIntervalSeconds: 5
    cooldownSeconds: 900
    targetSessionsPerReplica: 4
    scaleDownStabilizationSeconds: 900
    scaleDownPeriodSeconds: 600
  lifecycle:
    terminationGracePeriodSeconds: 1320
  image:
    repository: pi-cloud/supervisor-host
    tag: production
    digest: ""
    pullPolicy: IfNotPresent
  services:
    controlPlaneUrl: http://control-plane:3000
    sandboxControlUrls:
      - http://control-plane:4300
    providerProxyUrl: https://provider-proxy.example.com:3129
    providerGatewayUrl: https://provider-gateway.example.com
    otlpTracesEndpoint: ""
  database:
    existingSecret: pi-cloud-platform-secrets
    urlKey: database-url
    notificationUrlKey: database-notification-url
  credentials:
    supervisorEnrollmentTokenKey: supervisor-enrollment-token
    supervisorManagementTokenKey: supervisor-management-token
    sandboxControlTokenKey: sandbox-control-token
    providerGatewayApiKeyKey: cli-proxy-api-key
    metricsTokenKey: metrics-token
  runtime:
    allowInsecureInternalHttp: true
    modelConcurrency: null
    sessionModelConcurrency: null
    subagents:
      maximumDepth: null
      maximumNodes: null
    timeouts:
      sandboxControlRequestMs: 360000
      workerDrainMs: 30000
      workerRetirementMs: 660000
      modelUpstreamConnectMs: 240000
      modelUpstreamIdleMs: 300000
      modelRequestMs: 270000
  state:
    storageClassName: ""
    accessModes: [ReadWriteOncePod]
    size: 1Gi
  resources:
    requests: { cpu: 250m, memory: 384Mi }
  networkPolicy:
    enabled: true
    trustedNamespaceLabel: { key: pi-cloud.io/trusted-plane, value: "true" }
    trustedTcpPorts: [8333, 443, 3000, 3129, 4300, 4318, 5432, 8317, 9092]
    externalEgressCidrs: []
  disruptionBudget: { minAvailable: 1 }
  placement: { nodeSelector: {}, tolerations: [] }
  management:
    ingress: { enabled: false, className: "", hostSuffix: workers.pi-cloud.local, scheme: http }
  serviceAccount: { create: true, name: "" }

# A private S3 bucket with durable PUT acknowledgements; provision it before rollout.
imageAttachments:
  endpoint: ""
  region: us-east-1
  bucket: pi-cloud-session-images
  credentialsSecretKey: session-image-s3-credentials.json

# Optional complete reviewed catalog JSON. Empty uses the chart-owned seed.
modelCatalogJson: ""
