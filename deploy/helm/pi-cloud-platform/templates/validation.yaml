{{- if not (has .Values.sandboxPlane.provider (list "cubesandbox" "boxlite")) -}}
{{- fail "sandboxPlane.provider must be cubesandbox or boxlite" -}}
{{- end -}}
{{- if and (eq .Values.sandboxPlane.provider "boxlite") (or (not .Values.sandboxPlane.boxlite.url) (not .Values.sandboxPlane.boxlite.nodeId)) -}}
{{- fail "BoxLite requires its explicit node URL and identity" -}}
{{- end -}}
{{- if and (eq .Values.profile "distributed") (or .Values.globalPlaneEnabled .Values.sandboxPlaneEnabled) (lt (int .Values.controlPlane.replicas) 2) -}}
{{- fail "controlPlane.replicas must be at least 2 for the distributed profile" -}}
{{- end -}}
{{- if and (eq .Values.profile "distributed") .Values.globalPlaneEnabled (lt (int .Values.web.replicas) 2) -}}
{{- fail "web.replicas must be at least 2 for the distributed profile" -}}
{{- end -}}
{{- if and .Values.controlPlane.autoscaling.enabled (lt (int .Values.controlPlane.autoscaling.maxReplicas) (int .Values.controlPlane.autoscaling.minReplicas)) -}}
{{- fail "controlPlane.autoscaling.maxReplicas must be at least minReplicas" -}}
{{- end -}}
{{- if and .Values.web.autoscaling.enabled (lt (int .Values.web.autoscaling.maxReplicas) (int .Values.web.autoscaling.minReplicas)) -}}
{{- fail "web.autoscaling.maxReplicas must be at least minReplicas" -}}
{{- end -}}
{{- if and .Values.sandboxPlaneEnabled (not .Values.sandboxPlane.workspace.existingClaim) -}}
{{- fail "sandboxPlane.workspace.existingClaim must name an existing ReadWriteMany PVC" -}}
{{- end -}}
{{- if lt (len .Values.sandboxDomains) 1 -}}
{{- fail "sandboxDomains must contain at least one Sandbox Domain" -}}
{{- end -}}
{{- if ne (int .Values.toolHost.replicas) 1 -}}
{{- fail "The independently published tool host currently requires one replica" -}}
{{- end -}}
