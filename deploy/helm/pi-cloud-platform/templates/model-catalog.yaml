apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pi-cloud-platform.name" . }}-model-catalog
  labels:
    {{- include "pi-cloud-platform.labels" . | nindent 4 }}
data:
  model-catalog.json: |
    {{- (.Values.modelCatalogJson | default (.Files.Get "files/model-catalog.json")) | nindent 4 }}
