{{- if .Values.globalPlaneEnabled }}
{{- $name := include "pi-cloud-platform.name" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-metering
  labels:
    {{- include "pi-cloud-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: metering
spec:
  replicas: {{ .Values.metering.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: metering }
  template:
    metadata:
      labels:
        {{- include "pi-cloud-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: metering
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.trustedNodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.trustedTolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: metering
          image: {{ include "pi-cloud-platform.image" .Values.images.metering | quote }}
          imagePullPolicy: {{ .Values.images.metering.pullPolicy }}
          args: ["/app/packages/accounting/src/main.ts"]
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: HOST, value: 0.0.0.0 }
            - { name: PI_CLOUD_SANDBOX_LIFECYCLE_URL, value: {{ .Values.sandboxPlane.cube.apiUrl | quote }} }
            - { name: PI_CLOUD_SANDBOX_DOMAIN_ID, value: {{ .Values.sandboxPlane.domainId | quote }} }
            {{- if .Values.sandboxPlane.cube.lifecycleRedisSecret.name }}
            - { name: PI_CLOUD_CUBE_LIFECYCLE_REDIS_PASSWORD_FILE, value: /run/pi-cloud-native/redis-password }
            {{- end }}
            - { name: PI_CLOUD_CUBE_LIFECYCLE_REDIS_URL, value: {{ .Values.sandboxPlane.cube.lifecycleRedisUrl | quote }} }
            - { name: PI_CLOUD_CUBESANDBOX_API_KEY_FILE, value: /run/pi-cloud-secrets/cubesandbox-api-key }
            - { name: DATABASE_URL_FILE, value: /run/pi-cloud-secrets/database-url }
            - { name: PI_CLOUD_METERING_TOKEN_FILE, value: /run/pi-cloud-secrets/metering-key }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.metering.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.sandboxPlane.cube.lifecycleRedisSecret.name }}
            - { name: native-lifecycle-secret, mountPath: /run/pi-cloud-native/redis-password, subPath: redis-password, readOnly: true }
            {{- end }}
            - { name: platform-secrets, mountPath: /run/pi-cloud-secrets/cubesandbox-api-key, subPath: cubesandbox-api-key, readOnly: true }
            - { name: platform-secrets, mountPath: /run/pi-cloud-secrets/database-url, subPath: {{ .Values.external.database.secretKey }}, readOnly: true }
            - { name: platform-secrets, mountPath: /run/pi-cloud-secrets/metering-key, subPath: metering-ingest-token, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- if .Values.sandboxPlane.cube.lifecycleRedisSecret.name }}
        - name: native-lifecycle-secret
          secret:
            secretName: {{ .Values.sandboxPlane.cube.lifecycleRedisSecret.name }}
            defaultMode: 288
            items: [{ key: {{ .Values.sandboxPlane.cube.lifecycleRedisSecret.key }}, path: redis-password }]
        {{- end }}
        - name: platform-secrets
          secret: { secretName: {{ .Values.global.existingSecret }}, defaultMode: 288 }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: metering }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: metering }
  ports: [{ name: http, port: 3000, targetPort: http }]
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ $name }}-metering }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: metering }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { {{ .Values.networkPolicy.trustedNamespaceLabel.key }}: {{ .Values.networkPolicy.trustedNamespaceLabel.value | quote }} }
      ports: [{ protocol: TCP, port: 3000 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - namespaceSelector:
            matchLabels: { {{ .Values.networkPolicy.trustedNamespaceLabel.key }}: {{ .Values.networkPolicy.trustedNamespaceLabel.value | quote }} }
      ports:
        - { protocol: TCP, port: 5432 }
        {{- range $.Values.metering.sourcePorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- range .Values.networkPolicy.externalEgressCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports:
        - { protocol: TCP, port: 5432 }
        {{- range $.Values.metering.sourcePorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
