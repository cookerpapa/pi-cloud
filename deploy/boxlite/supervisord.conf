[unix_http_server]
file=/run/pi-cloud-boxlite-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/pi-cloud-boxlite-supervisor.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/pi-cloud-boxlite-supervisor.sock

[program:api]
command=/usr/local/bin/node /app/node_modules/tsx/dist/cli.mjs --tsconfig /app/packages/boxlite-node/tsconfig.json /app/packages/boxlite-node/src/main.ts
directory=/app
autorestart=true
startsecs=1
startretries=20
stopsignal=TERM
stopwaitsecs=20
stopasgroup=false
killasgroup=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
