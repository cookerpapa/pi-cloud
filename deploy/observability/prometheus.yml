global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: pi-cloud-prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: pi-cloud-alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: pi-cloud-control-plane
    bearer_token_file: /run/pi-cloud-secrets/metrics-token
    static_configs:
      - targets: [control-plane:9464]
  - job_name: pi-cloud-trusted-runner
    bearer_token_file: /run/pi-cloud-secrets/metrics-token
    static_configs:
      - targets:
          - pi-cloud-pi-worker-primary-v1-0.pi-cloud-pi-worker-primary-v1:9465
          - pi-cloud-pi-worker-primary-v1-1.pi-cloud-pi-worker-primary-v1:9465
  - job_name: pi-cloud-workspace-volume-gateway
    bearer_token_file: /run/pi-cloud-secrets/metrics-token
    static_configs:
      - targets: [workspace-volume-gateway:9469]
